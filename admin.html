<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGAGEN 관리자 센터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- 관리자 상단 바 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">
          <img src="megagen_logo.png" alt="MEGAGEN" class="h-8 w-auto object-contain" onerror="this.onerror=null; this.src='images/megagen_logo.png';">
          <span class="text-slate-300 font-light text-xl">|</span>
          <span class="text-lg font-bold text-slate-800 tracking-tight">관리자 센터</span>
        </a>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="changePassword()" id="btnChangePw" class="hidden px-4 py-2 text-xs font-semibold text-slate-600 hover:text-sky-600 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 transition">
          <i class="fa-solid fa-key mr-1"></i> 비밀번호 변경
        </button>
        <a href="index.html" class="px-4 py-2 text-xs font-bold text-sky-600 hover:bg-sky-50 rounded-xl border border-sky-200 transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i> 라운지로 돌아가기
        </a>
      </div>
    </div>
  </header>

  <!-- 관리자 로그인 섹션 -->
  <div id="authContainer" class="max-w-md mx-auto mt-24 p-8 bg-white rounded-3xl border border-slate-200 shadow-xl">
    <div class="w-12 h-12 bg-sky-50 rounded-2xl flex items-center justify-center text-sky-600 mb-4 mx-auto text-xl">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-xl font-bold text-center text-slate-900 tracking-tight">관리자 인증</h2>
    <p class="text-xs text-center text-slate-500 mt-1 mb-6">콘텐츠 관리 및 설정을 위해 비밀번호를 입력하세요.</p>
    
    <div class="space-y-3">
      <input type="password" id="adminPasswordInput" onkeypress="if(event.keyCode==13) verifyLogin()" placeholder="비밀번호 입력 (기본: 1234)" 
        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
      <button onclick="verifyLogin()" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-sm transition shadow-sm">
        인증하고 입장하기
      </button>
    </div>
  </div>

  <!-- 관리자 메인 대시보드 (로그인 후 표시) -->
  <main id="dashboardContainer" class="hidden max-w-7xl mx-auto px-6 py-10">
    
    <!-- 상단 탭 네비게이션 -->
    <div class="flex items-center gap-6 border-b border-slate-200 pb-4 mb-8">
      <button onclick="switchTab('videos')" id="tabVideosBtn" class="text-base font-bold text-sky-600 border-b-2 border-sky-600 pb-2">
        🎬 영상 콘텐츠 관리 (<span id="videoCountBadge">0</span>)
      </button>
      <button onclick="switchTab('categories')" id="tabCategoriesBtn" class="text-base font-medium text-slate-400 hover:text-slate-700 pb-2">
        🏷️ 카테고리 관리 (<span id="catCountBadge">0</span>)
      </button>
    </div>

    <!-- [탭 1] 영상 콘텐츠 관리 섹션 -->
    <section id="videosTabSection" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- 좌측: 영상 신규 등록 / 수정 폼 -->
      <div class="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4 h-fit sticky top-28">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <h3 id="formTitle" class="text-base font-bold text-slate-900 tracking-tight">새 영상 등록</h3>
          <button onclick="resetVideoForm()" id="btnCancelEdit" class="hidden text-xs text-rose-500 hover:underline">수정 취소</button>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">소속 카테고리</label>
          <select id="videoCategorySelect" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">영상 제목</label>
          <input type="text" id="videoTitleInput" placeholder="예: ARi 전치부 식립 솔루션 런칭" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">한 줄 설명</label>
          <input type="text" id="videoDescInput" placeholder="예: 치조골 흡수가 심한 전치부 극복 프로토콜" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">상태</label>
            <select id="videoStatusSelect" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
              <option value="active">즉시 공개</option>
              <option value="locked">오픈 예정 (잠금)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">상단 추천 고정</label>
            <select id="videoPinnedSelect" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
              <option value="false">일반 노출</option>
              <option value="true">⭐ 추천 고정</option>
            </select>
          </div>
        </div>

        <!-- 신제품 및 노출 여부 체크박스 -->
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="videoIsNewCheckbox" class="w-4 h-4 text-amber-500 rounded border-slate-300 focus:ring-amber-400">
            <span class="text-xs font-bold text-amber-700">⚡ 신제품 탭 동시 노출</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="videoIsVisibleCheckbox" checked class="w-4 h-4 text-sky-600 rounded border-slate-300 focus:ring-sky-500">
            <span class="text-xs font-bold text-slate-700">👁️ 사이트 노출</span>
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">유튜브 링크</label>
          <input type="text" id="videoUrlInput" placeholder="https://youtu.be/... 또는 watch?v=..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">다운로드 링크 (선택)</label>
          <input type="text" id="videoDownloadInput" placeholder="구글드라이브 / 클라우드 공유 링크" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">카톡 공유 추천 멘트</label>
          <input type="text" id="videoShareMsgInput" placeholder="원장님, 문의주신 솔루션 영상 공유드립니다." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
        </div>

        <input type="hidden" id="editingVideoId" value="">
        <button onclick="saveVideo()" id="btnSaveVideo" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs transition shadow-sm">
          영상 등록 완료
        </button>
      </div>

      <!-- 우측: 등록된 영상 관리 리스트 -->
      <div class="lg:col-span-7 space-y-3">
      <div class="flex items-center justify-between pb-2">
        <h3 class="text-sm font-bold text-slate-700">전체 등록 리스트</h3>
        <span class="text-xs text-slate-400">드래그 대신 상하(▲▼) 버튼으로 순서 조정</span>
      </div>

      <!-- 카테고리 필터 버튼 탭 & 카운트 -->
      <div class="mb-5 flex flex-wrap gap-2 items-center justify-between border-b border-slate-100 pb-4">
        <div class="flex flex-wrap gap-1.5" id="adminCategoryFilters">
          <!-- JS 함수(renderAdminCategoryFilters)로 버튼들이 자동 생성됩니다 -->
        </div>
        <div class="text-xs text-slate-400">
          선택된 영상: <span id="currentFilteredCount" class="font-bold text-sky-600">0</span>개
        </div>
      </div>

      <!-- 영상 리스트 렌더링 컨테이너 (1개만 유지) -->
      <div id="adminVideoList" class="space-y-2.5">
        <!-- 스크립트로 렌더링 -->
      </div>
    </div>

    </section>

    <!-- [탭 2] 카테고리 관리 섹션 -->
    <section id="categoriesTabSection" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- 좌측: 카테고리 추가 -->
      <div class="lg:col-span-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4 h-fit">
        <h3 class="text-base font-bold text-slate-900 tracking-tight pb-3 border-b border-slate-100">새 카테고리 생성</h3>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">카테고리명</label>
          <input type="text" id="newCategoryInput" placeholder="예: 핸드피스 & 소형장비" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
        </div>
        <button onclick="addCategory()" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs transition shadow-sm">
          카테고리 추가
        </button>
      </div>

      <!-- 우측: 카테고리 리스트 & 순서 이동/숨김/삭제 -->
      <div class="lg:col-span-8 space-y-3">
        <div class="flex items-center justify-between pb-2">
          <h3 class="text-sm font-bold text-slate-700">카테고리 노출 및 순서 관리</h3>
          <span class="text-xs text-slate-400">숨김 처리 시 메인 네비게이션 탭에서만 감춰집니다.</span>
        </div>
        <div id="adminCategoryList" class="space-y-2">
          <!-- 스크립트로 렌더링 -->
        </div>
      </div>
    </section>

  </main>

  <script>
    // 기본 카테고리 및 영상 DB
    const defaultRawCategories = [
      { name: "신제품", isVisible: true },
      { name: "임플란트 솔루션", isVisible: true },
      { name: "디지털 솔루션", isVisible: true },
      { name: "바이오레이즈 솔루션", isVisible: true },
      { name: "엔도 솔루션", isVisible: true },
      { name: "장비 및 재료·재생", isVisible: true }
    ];

    let savedCats = JSON.parse(localStorage.getItem('megagen_categories'));
    let categories = [];
    if (!savedCats) {
      categories = defaultRawCategories;
    } else {
      categories = savedCats.map(c => {
        if (typeof c === 'string') return { name: c, isVisible: true };
        return { name: c.name, isVisible: c.isVisible !== false };
      });
    }

    let savedVideos = JSON.parse(localStorage.getItem('megagen_videos'));
    let videos = [];
    if (!savedVideos) {
      videos = [
        {
          id: 1,
          category: "임플란트 솔루션",
          title: "ARi 전치부 식립 솔루션 런칭",
          desc: "치조골 흡수가 심한 전치부 극복을 위한 특화 프로토콜",
          status: "active",
          isPinned: true,
          isNew: true,
          isVisible: true,
          videoUrl: "https://www.youtube.com/embed/GpXyohF9GxY",
          thumbUrl: "https://img.youtube.com/vi/GpXyohF9GxY/hqdefault.jpg",
          downloadUrl: "https://youtu.be/GpXyohF9GxY",
          shareMsg: "원장님, 문의주신 ARi 전치부 식립 솔루션 영상 공유드립니다. 진료 및 상담에 도움 되시길 바랍니다."
        },
        {
          id: 2,
          category: "디지털 솔루션",
          title: "R2i5 구강스캐너 실시간 핸즈온",
          desc: "초고속 무치악 스캔 및 직관적인 디지털 워크플로우",
          status: "active",
          isPinned: false,
          isNew: true,
          isVisible: true,
          videoUrl: "https://www.youtube.com/embed/GpXyohF9GxY",
          thumbUrl: "https://img.youtube.com/vi/GpXyohF9GxY/hqdefault.jpg",
          downloadUrl: "https://youtu.be/GpXyohF9GxY",
          shareMsg: "원장님, 문의주신 R2i5 구강스캐너 실시간 핸즈온 영상 공유드립니다. 진료 및 상담에 도움 되시길 바랍니다."
        }
      ];
    } else {
      videos = savedVideos.map(v => ({
        ...v,
        isNew: v.isNew === true,
        isVisible: v.isVisible !== false
      }));
    }

    // 유튜브 URL 추출 헬퍼
    function getYouTubeInfo(url) {
      if(!url) return { embedUrl: "", thumbUrl: "" };
      let videoId = "";
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);

      if (match && match[2].length === 11) {
        videoId = match[2];
        return {
          embedUrl: `https://www.youtube.com/embed/${videoId}`,
          thumbUrl: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
        };
      }
      return { embedUrl: url, thumbUrl: "" };
    }

    // 관리자 인증 로직
    function verifyLogin() {
      const entered = document.getElementById('adminPasswordInput').value;
      const storedPw = localStorage.getItem('megagen_admin_pw') || "1234";

      if (entered === storedPw) {
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('dashboardContainer').classList.remove('hidden');
        document.getElementById('btnChangePw').classList.remove('hidden');
        renderCategorySelect();
        renderAdminCategoryFilters();
        renderAdminVideos();
        renderAdminCategories();
      } else {
        alert("비밀번호가 올바르지 않습니다. (기본 비밀번호: 1234)");
      }
    }

    function changePassword() {
      const currentPw = localStorage.getItem('megagen_admin_pw') || "1234";
      const checkPw = prompt("현재 비밀번호를 입력하세요:");
      if (checkPw !== currentPw) {
        if(checkPw !== null) alert("현재 비밀번호가 일치하지 않습니다.");
        return;
      }

      const newPw = prompt("새로운 비밀번호를 입력하세요:");
      if (newPw && newPw.trim().length > 0) {
        localStorage.setItem('megagen_admin_pw', newPw.trim());
        alert("비밀번호가 성공적으로 변경되었습니다.");
      }
    }

    // 탭 전환
    function switchTab(tab) {
      const vSection = document.getElementById('videosTabSection');
      const cSection = document.getElementById('categoriesTabSection');
      const vBtn = document.getElementById('tabVideosBtn');
      const cBtn = document.getElementById('tabCategoriesBtn');

      if (tab === 'videos') {
        vSection.classList.remove('hidden');
        cSection.classList.add('hidden');
        vBtn.className = "text-base font-bold text-sky-600 border-b-2 border-sky-600 pb-2";
        cBtn.className = "text-base font-medium text-slate-400 hover:text-slate-700 pb-2";
      } else {
        vSection.classList.add('hidden');
        cSection.classList.remove('hidden');
        cBtn.className = "text-base font-bold text-sky-600 border-b-2 border-sky-600 pb-2";
        vBtn.className = "text-base font-medium text-slate-400 hover:text-slate-700 pb-2";
      }
    }

    // 카테고리 셀렉트 렌더링
    function renderCategorySelect() {
      const select = document.getElementById('videoCategorySelect');
      select.innerHTML = "";
      categories.forEach(cat => {
        select.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
      });
    }

    // 영상 리스트 렌더링
    // 현재 선택된 관리자 카테고리 필터 상태
let adminSelectedCategory = "전체";

// 1. 카테고리 필터 버튼 탭 생성
function renderAdminCategoryFilters() {
  const filterContainer = document.getElementById('adminCategoryFilters');
  if (!filterContainer) return;

  const catList = ["전체", "신제품", "임플란트 솔루션", "디지털 솔루션", "바이오레이즈 솔루션", "엔도 솔루션", "장비 및 재료·재생"];
  
  filterContainer.innerHTML = catList.map(cat => {
    // 카테고리별 영상 개수 카운트
    const count = (cat === "전체") 
      ? videos.length 
      : (cat === "신제품" 
          ? videos.filter(v => v.isNew === true).length 
          : videos.filter(v => v.category === cat).length);
          
    const isActive = adminSelectedCategory === cat;
    
    return `
      <button 
        type="button"
        onclick="setAdminCategoryFilter('${cat}')" 
        class="px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${
          isActive 
            ? 'bg-sky-600 text-white shadow-sm' 
            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
        }">
        <span>${cat}</span>
        <span class="text-[10px] px-1.5 py-0.2 rounded-full ${isActive ? 'bg-sky-700 text-white' : 'bg-slate-200 text-slate-500'}">${count}</span>
      </button>
    `;
  }).join('');
}

// 2. 카테고리 필터 전환 함수
function setAdminCategoryFilter(categoryName) {
  adminSelectedCategory = categoryName;
  renderAdminCategoryFilters();
  renderAdminVideos();
}

// 3. 필터링된 영상 관리 리스트 렌더링
function renderAdminVideos() {
  const list = document.getElementById('adminVideoList');
  const countBadge = document.getElementById('videoCountBadge');
  const filteredCountEl = document.getElementById('currentFilteredCount');
  
  if (countBadge) countBadge.innerText = videos.length;
  if (!list) return;

  // 카테고리 필터 적용
  let filtered = [];
  if (adminSelectedCategory === "전체") {
    filtered = videos;
  } else if (adminSelectedCategory === "신제품") {
    filtered = videos.filter(v => v.isNew === true);
  } else {
    filtered = videos.filter(v => v.category === adminSelectedCategory);
  }

  if (filteredCountEl) filteredCountEl.innerText = filtered.length;
  list.innerHTML = "";

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="py-12 text-center text-slate-400 text-xs bg-slate-50 rounded-xl border border-dashed border-slate-200">
        해당 카테고리에 등록된 영상이 없습니다.
      </div>
    `;
    return;
  }

  filtered.forEach((v) => {
    // 전체 배열 기준의 인덱스를 찾아 순서 이동 및 수정/삭제가 정확히 동작하도록 연동
    const realIdx = videos.findIndex(item => item.id === v.id);
    const isHidden = v.isVisible === false;

    list.innerHTML += `
      <div class="p-3.5 bg-white border border-slate-200 rounded-2xl flex items-center justify-between gap-3 shadow-sm ${isHidden ? 'opacity-50 bg-slate-50' : ''}">
        <div class="flex items-center gap-3 overflow-hidden">
          <span class="text-slate-400 font-mono font-semibold w-5 text-center text-xs">${realIdx + 1}</span>
          <div class="w-14 h-9 rounded-lg bg-slate-100 overflow-hidden flex-shrink-0 relative">
            ${v.thumbUrl ? `<img src="${v.thumbUrl}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-400 text-[10px]">🔒</div>`}
          </div>
          <div class="truncate">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[10px] font-semibold text-sky-600 bg-sky-50 px-1.5 py-0.5 rounded">${v.category}</span>
              ${v.isPinned ? `<span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">⭐ 고정</span>` : ''}
              ${v.isNew ? `<span class="text-[10px] font-bold text-amber-600 bg-amber-100 px-1.5 py-0.5 rounded">⚡ NEW</span>` : ''}
              <span class="font-bold text-slate-800 text-xs truncate">${v.title}</span>
            </div>
            <span class="text-[11px] text-slate-400 block truncate mt-0.5">${v.desc || '설명 없음'}</span>
          </div>
        </div>

        <!-- 컨트롤 버튼 군 -->
        <div class="flex items-center gap-1 flex-shrink-0">
          <button type="button" onclick="moveVideo(${realIdx}, -1)" ${realIdx === 0 ? 'disabled class="opacity-20"' : ''} title="위로 이동" class="w-7 h-7 bg-slate-50 hover:bg-slate-100 rounded-lg flex items-center justify-center text-slate-600 text-xs">▲</button>
          <button type="button" onclick="moveVideo(${realIdx}, 1)" ${realIdx === videos.length - 1 ? 'disabled class="opacity-20"' : ''} title="아래로 이동" class="w-7 h-7 bg-slate-50 hover:bg-slate-100 rounded-lg flex items-center justify-center text-slate-600 text-xs">▼</button>
          
          <!-- 노출 / 숨김 토글 -->
          <button type="button" onclick="toggleVideoVisibility(${realIdx})" title="영상 노출/숨김 전환" class="px-2.5 py-1 text-[11px] font-bold rounded-lg border transition ${v.isVisible !== false ? 'bg-sky-50 text-sky-700 border-sky-200 hover:bg-sky-100' : 'bg-slate-100 text-slate-400 border-slate-200 hover:bg-slate-200'}">
            ${v.isVisible !== false ? '👁️ 노출' : '🚫 숨김'}
          </button>

          <button type="button" onclick="editVideo(${realIdx})" title="수정" class="w-7 h-7 bg-sky-50 text-sky-600 rounded-lg flex items-center justify-center text-xs hover:bg-sky-100">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button type="button" onclick="deleteVideo(${realIdx})" title="삭제" class="w-7 h-7 bg-rose-50 text-rose-500 rounded-lg flex items-center justify-center text-xs hover:bg-rose-100">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </div>
    `;
  });
}

    // 영상 노출/숨김 토글 함수
    function toggleVideoVisibility(idx) {
      videos[idx].isVisible = videos[idx].isVisible === false ? true : false;
      saveVideosSync();
    }

    // 영상 등록 및 수정 저장
    function saveVideo() {
      const editId = document.getElementById('editingVideoId').value;
      const rawUrl = document.getElementById('videoUrlInput').value.trim();
      const ytInfo = getYouTubeInfo(rawUrl);

      const title = document.getElementById('videoTitleInput').value.trim();
      if (!title) {
        alert("영상 제목을 입력해 주세요.");
        return;
      }

      const videoData = {
        id: editId ? Number(editId) : Date.now(),
        category: document.getElementById('videoCategorySelect').value,
        title: title,
        desc: document.getElementById('videoDescInput').value.trim(),
        status: document.getElementById('videoStatusSelect').value,
        isPinned: document.getElementById('videoPinnedSelect').value === 'true',
        isNew: document.getElementById('videoIsNewCheckbox').checked,
        isVisible: document.getElementById('videoIsVisibleCheckbox').checked,
        videoUrl: ytInfo.embedUrl || rawUrl,
        thumbUrl: ytInfo.thumbUrl,
        downloadUrl: document.getElementById('videoDownloadInput').value.trim(),
        shareMsg: document.getElementById('videoShareMsgInput').value.trim()
      };

      if (editId) {
        const index = videos.findIndex(v => v.id === Number(editId));
        if (index !== -1) videos[index] = videoData;
      } else {
        videos.unshift(videoData);
      }

      saveVideosSync();
      resetVideoForm();
      alert("영상 콘텐츠가 성공적으로 저장되었습니다!");
    }

    function editVideo(idx) {
      const v = videos[idx];
      document.getElementById('formTitle').innerText = "영상 콘텐츠 수정";
      document.getElementById('btnCancelEdit').classList.remove('hidden');
      document.getElementById('btnSaveVideo').innerText = "수정사항 저장";
      document.getElementById('editingVideoId').value = v.id;

      document.getElementById('videoCategorySelect').value = v.category;
      document.getElementById('videoTitleInput').value = v.title;
      document.getElementById('videoDescInput').value = v.desc || "";
      document.getElementById('videoStatusSelect').value = v.status;
      document.getElementById('videoPinnedSelect').value = v.isPinned ? "true" : "false";
      document.getElementById('videoIsNewCheckbox').checked = v.isNew === true;
      document.getElementById('videoIsVisibleCheckbox').checked = v.isVisible !== false;
      document.getElementById('videoUrlInput').value = v.videoUrl || "";
      document.getElementById('videoDownloadInput').value = v.downloadUrl || "";
      document.getElementById('videoShareMsgInput').value = v.shareMsg || "";
    }

    function resetVideoForm() {
      document.getElementById('formTitle').innerText = "새 영상 등록";
      document.getElementById('btnCancelEdit').classList.add('hidden');
      document.getElementById('btnSaveVideo').innerText = "영상 등록 완료";
      document.getElementById('editingVideoId').value = "";

      document.getElementById('videoTitleInput').value = "";
      document.getElementById('videoDescInput').value = "";
      document.getElementById('videoUrlInput').value = "";
      document.getElementById('videoDownloadInput').value = "";
      document.getElementById('videoShareMsgInput').value = "";
      document.getElementById('videoIsNewCheckbox').checked = false;
      document.getElementById('videoIsVisibleCheckbox').checked = true;
    }

    function moveVideo(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= videos.length) return;
      const temp = videos[index];
      videos[index] = videos[target];
      videos[target] = temp;
      saveVideosSync();
    }

    function deleteVideo(idx) {
      if (confirm(`'${videos[idx].title}' 영상을 삭제하시겠습니까?`)) {
        videos.splice(idx, 1);
        saveVideosSync();
      }
    }

    function saveVideosSync() {
      localStorage.setItem('megagen_videos', JSON.stringify(videos));
      renderAdminVideos();
    }

    // ==========================================
    // 카테고리 관리 함수군
    // ==========================================
    function renderAdminCategories() {
      const list = document.getElementById('adminCategoryList');
      document.getElementById('catCountBadge').innerText = categories.length;
      list.innerHTML = "";

      categories.forEach((cat, idx) => {
        const isHidden = cat.isVisible === false;
        list.innerHTML += `
          <div class="p-3 bg-white border border-slate-200 rounded-2xl flex items-center justify-between shadow-sm ${isHidden ? 'opacity-50 bg-slate-50' : ''}">
            <div class="flex items-center gap-3">
              <span class="text-slate-400 font-mono text-xs w-4 text-center">${idx + 1}</span>
              <span class="font-bold text-sm ${isHidden ? 'text-slate-400 line-through' : 'text-slate-800'}">${cat.name}</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="moveCategory(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-20"' : ''} class="w-7 h-7 bg-slate-50 hover:bg-slate-100 rounded-lg flex items-center justify-center text-slate-600 text-xs">▲</button>
              <button onclick="moveCategory(${idx}, 1)" ${idx === categories.length - 1 ? 'disabled class="opacity-20"' : ''} class="w-7 h-7 bg-slate-50 hover:bg-slate-100 rounded-lg flex items-center justify-center text-slate-600 text-xs">▼</button>
              <button onclick="toggleCategoryVisibility(${idx})" class="px-2.5 py-1 text-xs font-semibold rounded-lg border transition ${cat.isVisible !== false ? 'bg-sky-50 text-sky-600 border-sky-200' : 'bg-slate-100 text-slate-400 border-slate-200'}">
                ${cat.isVisible !== false ? '👁️ 노출' : '🚫 숨김'}
              </button>
              <button onclick="renameCategory(${idx})" class="px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600">수정</button>
              <button onclick="deleteCategory(${idx})" class="w-7 h-7 bg-rose-50 hover:bg-rose-100 text-rose-500 rounded-lg flex items-center justify-center text-xs">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    function addCategory() {
      const input = document.getElementById('newCategoryInput');
      const val = input.value.trim();
      if (!val) return;
      if (categories.some(c => c.name === val)) {
        alert("이미 존재하는 카테고리입니다.");
        return;
      }
      categories.push({ name: val, isVisible: true });
      saveCategoriesSync();
      input.value = "";
    }

    function toggleCategoryVisibility(idx) {
      categories[idx].isVisible = categories[idx].isVisible === false ? true : false;
      saveCategoriesSync();
    }

    function renameCategory(idx) {
      const newName = prompt("변경할 카테고리명을 입력하세요:", categories[idx].name);
      if (newName && newName.trim() && newName.trim() !== categories[idx].name) {
        const oldName = categories[idx].name;
        categories[idx].name = newName.trim();
        videos.forEach(v => {
          if (v.category === oldName) v.category = newName.trim();
        });
        localStorage.setItem('megagen_videos', JSON.stringify(videos));
        saveCategoriesSync();
      }
    }

    function deleteCategory(idx) {
      if (confirm(`'${categories[idx].name}' 카테고리를 삭제하시겠습니까?`)) {
        categories.splice(idx, 1);
        saveCategoriesSync();
      }
    }

    function moveCategory(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= categories.length) return;
      const temp = categories[index];
      categories[index] = categories[target];
      categories[target] = temp;
      saveCategoriesSync();
    }

    function saveCategoriesSync() {
      localStorage.setItem('megagen_categories', JSON.stringify(categories));
      renderCategorySelect();
      renderAdminCategories();
    }
  </script>
</body>
</html>
