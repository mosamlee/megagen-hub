  <style>

  <!-- 관리자 로그인 락 화면 -->

    <div class="w-full max-w-md text-center">

      <form onsubmit="handleLogin(event)" class="mt-8 space-y-4">

        <button type="submit" class="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl text-base transition shadow-sm">로그인</button>
        <a href="index.html" class="block text-sm text-slate-400 hover:text-slate-600 pt-3">← 메인 페이지로 돌아가기</a>
      </form>
    </div>
  </div>

  <!-- 관리자 상단 헤더 -->

    <div class="max-w-7xl mx-auto px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-2xl font-black text-sky-600">MEGAGEN</a>
        <span class="text-slate-300 text-xl">|</span>
        <span class="text-base font-bold text-slate-800">관리자 센터</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="promptChangePassword()" class="px-4 py-2 text-sm text-slate-600 hover:text-sky-600 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg transition flex items-center gap-2">
          <i class="fa-solid fa-key"></i> 비밀번호 변경
        </button>
        <button onclick="handleLogout()" class="px-4 py-2 text-sm text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-lg transition flex items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
        </button>
        <a href="index.html" class="px-4 py-2 text-sm text-white bg-slate-800 hover:bg-slate-900 rounded-lg transition flex items-center gap-2">
          <i class="fa-solid fa-house"></i> 메인 허브
        </a>
      </div>
    </div>

    <!-- 관리 3대 탭 메뉴 -->
    <div class="max-w-7xl mx-auto px-8 flex gap-8 text-base font-semibold border-t border-slate-100">
      <button onclick="switchTab('tabRegister')" id="btnTabRegister" class="tab-btn text-sky-600 border-b-2 border-sky-600 py-3.5 transition">
        + 영상 등록
      </button>
      <button onclick="switchTab('tabVideos')" id="btnTabVideos" class="tab-btn text-slate-400 hover:text-slate-700 py-3.5 transition">
        🎬 영상 순서 & 삭제 관리
      </button>
      <button onclick="switchTab('tabCategories')" id="btnTabCategories" class="tab-btn text-slate-400 hover:text-slate-700 py-3.5 transition">
        📁 카테고리 관리
      </button>
    </div>
  </header>

  <!-- 관리 메인 콘텐츠 -->
  <main class="max-w-7xl mx-auto px-8 py-10 flex-1 w-full">

    <!-- 탭 1: 신규 영상 등록 -->
    <section id="tabRegister" class="max-w-3xl bg-white p-10 rounded-3xl border border-slate-200 shadow-sm space-y-6">
      <div>
        <h3 class="text-xl font-bold text-slate-900">새 영상 콘텐츠 등록</h3>
        <p class="text-sm text-slate-500 mt-1">유튜브 링크를 입력하면 제목과 썸네일을 자동으로 가져옵니다.</p>
      </div>

      <!-- 유튜브 링크 입력란 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">
          유튜브 링크 <span class="text-sky-600 font-normal text-xs">* 링크 입력 후 [제목 가져오기]를 누르거나 바깥을 클릭하세요.</span>
        </label>
        <div class="relative">
          <input type="text" id="videoUrl" onblur="fetchYouTubeMeta()" placeholder="https://youtu.be/... 또는 https://www.youtube.com/watch?v=..." 
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
          <button type="button" onclick="fetchYouTubeMeta()" class="absolute right-2.5 top-1/2 -translate-y-1/2 px-3.5 py-1.5 bg-sky-100 hover:bg-sky-200 text-sky-700 rounded-lg text-xs font-bold transition">
            제목 가져오기
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">카테고리</label>
        <select id="videoCat" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
        </select>
      </div>

      <!-- 자동 입력 및 수동 수정 가능 영상 제목 -->

        <label class="block text-sm font-semibold text-slate-700 mb-1.5">
          영상 제목 <span class="text-slate-400 font-normal text-xs">(자동 입력 후 직접 수정 가능)</span>

        <input type="text" id="videoTitle" placeholder="유튜브 링크를 넣으면 자동으로 채워집니다." 
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">한 줄 설명</label>
        <input type="text" id="videoDesc" placeholder="예: 치조골 흡수가 심한 전치부 극복 프로토콜" 
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">공개 상태</label>
        <select id="videoStatus" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
          <option value="active">즉시 공개</option>
          <option value="locked">오픈 예정 (잠금 표시)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">다운로드 링크 (선택: 구글 드라이브 / MP4 직링크)</label>
        <input type="text" id="downloadUrl" placeholder="https://drive.google.com/..." 
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">카톡 공유 추천 멘트 (선택)</label>
        <input type="text" id="shareMsg" placeholder="원장님, 문의주신 영상 공유드립니다." 
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
      </div>

      <div class="pt-3">
        <button onclick="addVideo()" class="w-full py-4 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-base transition shadow-sm">
          영상 등록 완료
        </button>
      </div>
    </section>

    <!-- 탭 2: 영상 관리 리스트 -->
    <section id="tabVideos" class="hidden max-w-5xl bg-white p-10 rounded-3xl border border-slate-200 shadow-sm space-y-5">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <div>
          <h3 class="text-xl font-bold text-slate-900">등록된 영상 관리</h3>
          <p class="text-sm text-slate-500 mt-0.5">순서 이동(▲/▼), 공개 토글, 삭제가 가능합니다.</p>
        </div>
        <span id="videoTotalCount" class="text-sm font-semibold text-slate-600 bg-slate-100 px-3.5 py-1.5 rounded-full"></span>
      </div>
      <div id="videoListContainer" class="space-y-3 pt-2">
      </div>
    </section>

    <!-- 탭 3: 카테고리 관리 -->
    <section id="tabCategories" class="hidden max-w-4xl bg-white p-10 rounded-3xl border border-slate-200 shadow-sm space-y-6">
      <div>
        <h3 class="text-xl font-bold text-slate-900">카테고리 관리</h3>
        <p class="text-sm text-slate-500 mt-0.5">카테고리 추가, 순서 변경, 이름 수정 및 삭제를 관리합니다.</p>
      </div>

      <div class="flex gap-3">
        <input type="text" id="newCategoryName" placeholder="새 카테고리 이름 입력..." 
          class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500">
        <button onclick="addCategory()" class="px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl text-sm transition flex-shrink-0">
          + 카테고리 추가
        </button>
      </div>

      <div id="categoryListContainer" class="space-y-3 pt-3 border-t border-slate-100">
      </div>
    </section>

  </main>

  <script>
    const defaultCategories = [

    ];

    const initialVideos = [
      {
        id: 1,
        category: "신제품",
        title: "ARi 전치부 식립 솔루션 런칭",
        desc: "치조골 흡수가 심한 전치부 극복을 위한 특화 프로토콜",
        status: "active",
        videoUrl: "https://www.youtube.com/embed/GpXyohF9GxY",
        thumbUrl: "https://img.youtube.com/vi/GpXyohF9GxY/hqdefault.jpg",
        downloadUrl: "https://youtu.be/GpXyohF9GxY",
        shareMsg: "원장님, 문의주신 ARi 전치부 식립 솔루션 영상 공유드립니다."
      },
      {
        id: 2,
        category: "신제품",
        title: "R2i5 구강스캐너 실시간 핸즈온",
        desc: "초고속 무치악 스캔 및 직관적인 디지털 워크플로우",
        status: "active",
        videoUrl: "https://www.youtube.com/embed/GpXyohF9GxY",
        thumbUrl: "https://img.youtube.com/vi/GpXyohF9GxY/hqdefault.jpg",
        downloadUrl: "https://youtu.be/GpXyohF9GxY",
        shareMsg: "원장님, R2i5 구강스캐너 실시간 핸즈온 영상 공유드립니다."
      },
      {
        id: 3,
        category: "임플란트 솔루션",
        title: "박광범의 임플란트 수술방_최종보철 52회",
        desc: "골질 불량 부위 KnifeThread 식립 테크닉 및 라이브 서저리",
        status: "active",
        videoUrl: "https://www.youtube.com/embed/GpXyohF9GxY",
        thumbUrl: "https://img.youtube.com/vi/GpXyohF9GxY/hqdefault.jpg",
        downloadUrl: "https://youtu.be/GpXyohF9GxY",
        shareMsg: "원장님, 박광범 원장의 임플란트 수술방 하이라이트 영상 공유드립니다."
      },
      {
        id: 4,
        category: "임플란트 솔루션",
        title: "Molar Immediate 구치부 발치즉시 식립",
        desc: "BD Cuff를 활용한 연조직 보존 및 Bone Loss 방지",
        status: "locked",
        videoUrl: "",
        thumbUrl: "",
        downloadUrl: "",
        shareMsg: ""
      },
      {
        id: 5,
        category: "바이오레이즈 솔루션",
        title: "Waterlase 최소침습 치료 및 진료실 도입 가이드",
        desc: "물방울 레이저를 활용한 임플란트 주위염 및 치주 질환 케어",
        status: "active",
        videoUrl: "https://www.youtube.com/embed/GpXyohF9GxY",
        thumbUrl: "https://img.youtube.com/vi/GpXyohF9GxY/hqdefault.jpg",
        downloadUrl: "https://youtu.be/GpXyohF9GxY",
        shareMsg: "원장님, 워터레이저 최소침습 진료실 도입 가이드 영상 공유드립니다."
      }
    ];

    let categories = JSON.parse(localStorage.getItem('megagen_categories')) || defaultCategories;
    let videos = JSON.parse(localStorage.getItem('megagen_videos')) || initialVideos;

    // 유튜브 URL 파싱 함수
    function getYouTubeInfo(url) {
      if(!url) return { videoId: "", embedUrl: "", thumbUrl: "", watchUrl: "" };
      let videoId = "";
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);

      if (match && match[2].length === 11) {
        videoId = match[2];
        return {
          videoId: videoId,
          embedUrl: `https://www.youtube.com/embed/${videoId}`,
          thumbUrl: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
          watchUrl: `https://www.youtube.com/watch?v=${videoId}`
        };
      }
      return { videoId: "", embedUrl: url, thumbUrl: "", watchUrl: url };
    }

    // 유튜브 제목 자동 수집 (JSONP 우회 연동)
    async function fetchYouTubeMeta() {
      const urlInput = document.getElementById('videoUrl');
      const titleInput = document.getElementById('videoTitle');
      const url = urlInput.value.trim();
      const info = getYouTubeInfo(url);

      if (!info.videoId) {
        return;
      }

      if (titleInput.value.trim() !== "") {
        return;
      }

      const originalPlaceholder = titleInput.placeholder;
      titleInput.placeholder = "유튜브 제목을 불러오는 중입니다...";

      const callbackName = 'yt_cb_' + Math.floor(Math.random() * 100000);
      let isFetched = false;

      window[callbackName] = function(data) {
        if (data && data.title) {
          titleInput.value = data.title;
          isFetched = true;
        }
        cleanup();
      };

      const script = document.createElement('script');
      script.src = `https://www.youtube.com/oembed?url=${encodeURIComponent(info.watchUrl)}&format=json&callback=${callbackName}`;
      
      function cleanup() {
        if (document.body.contains(script)) document.body.removeChild(script);
        delete window[callbackName];
        titleInput.placeholder = originalPlaceholder;
      }

      script.onerror = async function() {
        cleanup();
        try {
          const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(info.watchUrl)}`);
          const data = await res.json();
          if (data && data.title) {
            titleInput.value = data.title;
          }
        } catch (e) {
          console.warn("YouTube meta load failed:", e);
        }
      };

      document.body.appendChild(script);

      setTimeout(() => {
        if (!isFetched && window[callbackName]) {
          cleanup();
        }
      }, 3000);
    }

    function getAdminPassword() {
      return localStorage.getItem('megagen_admin_pwd') || "1234";
    }

    function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('loginPassword').value;
      if (input === getAdminPassword()) {
        sessionStorage.setItem('megagen_admin_logged', 'true');
        document.getElementById('authLockScreen').classList.add('hidden');
        initAdminData();
      } else {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }

    function checkLoginStatus() {
      if (sessionStorage.getItem('megagen_admin_logged') === 'true') {
        document.getElementById('authLockScreen').classList.add('hidden');
        initAdminData();
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('megagen_admin_logged');
      location.reload();
    }

    function promptChangePassword() {
      const current = prompt("현재 비밀번호를 입력해주세요:");
      if (!current) return;
      if (current !== getAdminPassword()) {
        alert("현재 비밀번호가 일치하지 않습니다.");
        return;
      }
      const newPwd = prompt("새로 사용할 관리자 비밀번호를 입력해주세요:");
      if (!newPwd || newPwd.trim().length === 0) {
        alert("비밀번호를 입력해야 합니다.");
        return;
      }
      localStorage.setItem('megagen_admin_pwd', newPwd.trim());
      alert("관리자 비밀번호가 성공적으로 변경되었습니다.");
    }

    function switchTab(tabId) {
      ['tabRegister', 'tabVideos', 'tabCategories'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      ['btnTabRegister', 'btnTabVideos', 'btnTabCategories'].forEach(id => {
        document.getElementById(id).className = "tab-btn text-slate-400 hover:text-slate-700 py-3.5 transition";
      });

      document.getElementById(tabId).classList.remove('hidden');

      if (tabId === 'tabRegister') {
        document.getElementById('btnTabRegister').className = "tab-btn text-sky-600 border-b-2 border-sky-600 py-3.5 transition";
        renderCategoryOptions();
      } else if (tabId === 'tabVideos') {
        document.getElementById('btnTabVideos').className = "tab-btn text-sky-600 border-b-2 border-sky-600 py-3.5 transition";
        renderVideoList();
      } else if (tabId === 'tabCategories') {
        document.getElementById('btnTabCategories').className = "tab-btn text-sky-600 border-b-2 border-sky-600 py-3.5 transition";
        renderCategoryList();
      }
    }

    function renderCategoryOptions() {
      const sel = document.getElementById('videoCat');
      sel.innerHTML = "";
      categories.forEach(cat => {
        sel.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function renderVideoList() {
      const container = document.getElementById('videoListContainer');
      document.getElementById('videoTotalCount').innerText = `총 ${videos.length}개`;
      container.innerHTML = "";

      if(videos.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 py-8 text-center">등록된 영상이 없습니다.</p>`;
        return;
      }

      videos.forEach((v, idx) => {
        container.innerHTML += `
          <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 overflow-hidden">
              <span class="text-slate-400 font-mono font-bold text-sm w-6 text-center">${idx + 1}</span>
              <div class="w-16 h-10 rounded-lg bg-slate-200 overflow-hidden flex-shrink-0">
                ${v.thumbUrl ? `<img src="${v.thumbUrl}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-400 text-xs">🔒</div>`}
              </div>
              <div class="truncate">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold text-sky-600 bg-sky-50 px-2 py-0.5 rounded">${v.category}</span>
                  <span class="font-bold text-slate-900 text-sm truncate">${v.title}</span>
                </div>
                <span class="text-xs text-slate-400 block truncate mt-0.5">${v.desc || '설명 없음'}</span>
              </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <button onclick="moveVideo(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-20"' : ''} title="위로 이동" class="w-8 h-8 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600 text-xs">
                <i class="fa-solid fa-chevron-up"></i>
              </button>
              <button onclick="moveVideo(${idx}, 1)" ${idx === videos.length - 1 ? 'disabled class="opacity-20"' : ''} title="아래로 이동" class="w-8 h-8 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600 text-xs">
                <i class="fa-solid fa-chevron-down"></i>
              </button>
              <button onclick="toggleVideoStatus(${idx})" title="공개/잠금 전환" class="px-3 py-1.5 text-xs font-semibold rounded-lg border ${v.status === 'active' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-slate-100 text-slate-500 border-slate-200'}">
                ${v.status === 'active' ? '공개' : '잠금'}
              </button>
              <button onclick="deleteVideo(${idx})" title="삭제" class="w-8 h-8 bg-rose-50 border border-rose-200 rounded-lg hover:bg-rose-100 flex items-center justify-center text-rose-500 transition ml-1 text-xs">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    function moveVideo(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= videos.length) return;
      const tmp = videos[idx];
      videos[idx] = videos[target];
      videos[target] = tmp;
      saveVideos();
      renderVideoList();
    }

    function toggleVideoStatus(idx) {
      videos[idx].status = videos[idx].status === 'active' ? 'locked' : 'active';
      saveVideos();
      renderVideoList();
    }

    function deleteVideo(idx) {
      if (confirm(`'${videos[idx].title}' 영상을 삭제하시겠습니까?`)) {
        videos.splice(idx, 1);
        saveVideos();
        renderVideoList();
      }
    }

    function addVideo() {
      const rawUrl = document.getElementById('videoUrl').value.trim();
      const yt = getYouTubeInfo(rawUrl);

      const title = document.getElementById('videoTitle').value.trim();
      if(!title) {
        alert("영상 제목을 입력해주세요.");
        return;
      }

      const newV = {
        id: Date.now(),
        category: document.getElementById('videoCat').value,
        title: title,
        desc: document.getElementById('videoDesc').value.trim(),
        status: document.getElementById('videoStatus').value,
        videoUrl: yt.embedUrl || rawUrl,
        thumbUrl: yt.thumbUrl,
        downloadUrl: document.getElementById('downloadUrl').value.trim(),
        shareMsg: document.getElementById('shareMsg').value.trim()
      };

      videos.unshift(newV);
      saveVideos();
      alert("영상이 성공적으로 등록되었습니다!");

      document.getElementById('videoTitle').value = "";
      document.getElementById('videoDesc').value = "";
      document.getElementById('videoUrl').value = "";
      document.getElementById('downloadUrl').value = "";
      document.getElementById('shareMsg').value = "";
      switchTab('tabVideos');
    }

    function saveVideos() {
      localStorage.setItem('megagen_videos', JSON.stringify(videos));
    }

    function renderCategoryList() {
      const container = document.getElementById('categoryListContainer');
      container.innerHTML = "";

      categories.forEach((cat, idx) => {
        container.innerHTML += `
          <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <span class="text-slate-400 font-mono font-bold text-sm w-6 text-center">${idx + 1}</span>
              <span class="text-sm font-bold text-slate-800">${cat}</span>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="moveCategory(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-20"' : ''} title="위로 이동" class="w-8 h-8 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600 text-xs">
                <i class="fa-solid fa-chevron-up"></i>
              </button>
              <button onclick="moveCategory(${idx}, 1)" ${idx === categories.length - 1 ? 'disabled class="opacity-20"' : ''} title="아래로 이동" class="w-8 h-8 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600 text-xs">
                <i class="fa-solid fa-chevron-down"></i>
              </button>
              <button onclick="editCategory(${idx})" title="이름 수정" class="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg hover:bg-slate-100">
                수정
              </button>
              <button onclick="deleteCategory(${idx})" title="삭제" class="w-8 h-8 bg-rose-50 border border-rose-200 rounded-lg hover:bg-rose-100 flex items-center justify-center text-rose-500 transition ml-1 text-xs">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    function addCategory() {
      const input = document.getElementById('newCategoryName');
      const val = input.value.trim();
      if (!val) {
        alert("카테고리 이름을 입력해주세요.");
        return;
      }
      if (categories.includes(val)) {
        alert("이미 존재하는 카테고리입니다.");
        return;
      }
      categories.push(val);
      saveCategories();
      input.value = "";
      renderCategoryList();
      alert(`'${val}' 카테고리가 추가되었습니다.`);
    }

    function editCategory(idx) {
      const current = categories[idx];
      const newVal = prompt("수정할 카테고리 이름을 입력하세요:", current);
      if (!newVal || newVal.trim() === "" || newVal.trim() === current) return;

      const trimmed = newVal.trim();
      videos.forEach(v => {
        if (v.category === current) v.category = trimmed;
      });
      categories[idx] = trimmed;
      saveCategories();
      saveVideos();
      renderCategoryList();
    }

    function deleteCategory(idx) {
      const target = categories[idx];
      if (confirm(`'${target}' 카테고리를 삭제하시겠습니까?`)) {
        categories.splice(idx, 1);
        saveCategories();
        renderCategoryList();
      }
    }

    function moveCategory(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= categories.length) return;
      const tmp = categories[idx];
      categories[idx] = categories[target];
      categories[target] = tmp;
      saveCategories();
      renderCategoryList();
    }

    function saveCategories() {
      localStorage.setItem('megagen_categories', JSON.stringify(categories));
    }

    function initAdminData() {
      renderCategoryOptions();
      renderVideoList();
      renderCategoryList();
    }

    checkLoginStatus();
  </script>
</body>
</html>
