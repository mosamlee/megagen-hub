<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메가젠 국내영업 비디오 배포 허브</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 카카오 SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.1/kakao.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- 헤더 -->
  <header class="bg-sky-900 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight">MEGAGEN | 국내영업 비디오 배포 허브</h1>
      <input type="text" placeholder="제품/술식 검색..." class="px-3 py-1.5 rounded text-sm text-slate-800 w-64 focus:outline-none">
    </div>
    <!-- 6대 카테고리 탭 (넘버링 제외) -->
    <nav class="max-w-7xl mx-auto flex space-x-6 mt-3 text-sm font-medium overflow-x-auto pb-1 text-sky-200">
      <button class="text-white border-b-2 border-white pb-1">전체보기</button>
      <button class="hover:text-white pb-1">신제품</button>
      <button class="hover:text-white pb-1">임플란트 솔루션</button>
      <button class="hover:text-white pb-1">디지털 솔루션</button>
      <button class="hover:text-white pb-1">바이오레이즈 솔루션</button>
      <button class="hover:text-white pb-1">엔도 솔루션</button>
      <button class="hover:text-white pb-1">장비 및 재료·재생</button>
    </nav>
  </header>

  <!-- 메인 그리드 -->
  <main class="max-w-7xl mx-auto p-6 space-y-10">

    <!-- 신제품 섹션 -->
    <section>
      <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
        <span>🔥</span> 신제품
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5">
        
        <!-- 샘플 카드 1 -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          <div class="relative bg-slate-900 aspect-video flex items-center justify-center cursor-pointer group" onclick="openModal('https://www.youtube.com/embed/GpXyohF9GxY', 'ARi 전치부 솔루션')">
            <!-- 썸네일 이미지 자리 -->
            <div class="absolute text-white text-3xl group-hover:scale-110 transition">▶</div>
            <span class="absolute bottom-2 right-2 bg-black/70 text-white text-xs px-1.5 py-0.5 rounded">02:15</span>
          </div>
          <div class="p-3">
            <span class="text-xs font-semibold text-sky-600 bg-sky-50 px-2 py-0.5 rounded">신제품</span>
            <h3 class="font-bold text-sm mt-1 line-clamp-1">ARi 전치부 솔루션 런칭</h3>
            <p class="text-xs text-slate-500 mt-1 line-clamp-1">골 흡수가 심한 전치부 맞춤형 프로토콜</p>
          </div>
          <div class="p-3 pt-0 grid grid-cols-3 gap-1 text-xs">
            <button onclick="openModal('https://www.youtube.com/embed/GpXyohF9GxY', 'ARi 전치부 솔루션')" class="bg-sky-600 text-white py-1.5 rounded hover:bg-sky-700">바로보기</button>
            <button onclick="shareKakao('ARi 전치부 솔루션', 'https://youtu.be/GpXyohF9GxY')" class="bg-amber-400 text-amber-950 font-medium py-1.5 rounded hover:bg-amber-500">카톡 전송</button>
            <a href="https://youtu.be/GpXyohF9GxY" download class="bg-slate-100 text-slate-700 text-center py-1.5 rounded hover:bg-slate-200">다운로드</a>
          </div>
        </div>

        <!-- 오픈 예정 카드 예시 -->
        <div class="bg-slate-100 rounded-lg border border-dashed border-slate-300 flex flex-col items-center justify-center p-6 text-slate-400">
          <span class="text-2xl mb-1">🔒</span>
          <span class="text-xs font-semibold">오픈 예정</span>
          <span class="text-xs text-slate-400 mt-1">2026 하반기 패키지</span>
        </div>

      </div>
    </section>

  </main>

  <!-- 비디오 모달 팝업 -->
  <div id="videoModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-black rounded-lg w-full max-w-3xl overflow-hidden relative">
      <button onclick="closeModal()" class="absolute top-2 right-3 text-white text-2xl font-bold z-10">&times;</button>
      <div class="aspect-video w-full">
        <iframe id="videoIframe" class="w-full h-full" src="" frameborder="0" allowfullscreen allow="autoplay"></iframe>
      </div>
    </div>
  </div>

  <script>
    function openModal(url, title) {
      document.getElementById('videoIframe').src = url + "?autoplay=1";
      document.getElementById('videoModal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('videoIframe').src = "";
      document.getElementById('videoModal').classList.add('hidden');
    }
    function shareKakao(title, url) {
      navigator.clipboard.writeText(url).then(() => {
        alert(`[${title}]\n원장님 공유 링크가 클립보드에 복사되었습니다!\n카카오톡에 바로 붙여넣기 하시면 됩니다.`);
      });
    }
  </script>
</body>
</html>
